[project]
name = "ai-internship"
version = "0.1.0"
description = "Agent workflow experimentation and evaluation."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "anthropic>=0.111.0",
  "braintrust",
  "deepagents",
  "exa-py",
  "firecrawl-py",
  "graphiti-core",
  "langchain-core",
  "langchain-openai",
  "langchain-openrouter",
  "langgraph",
  "langgraph-cli[inmem]",
  "langsmith",
  "loguru",
  "neo4j>=5.26",
  "pre-commit",
  "pydantic>=2.0",
  "playwright",
  "pytest",
  "pytest-asyncio",
  "python-dotenv",
  "ruff",
  "scrapegraphai",
  "pypdf>=6.16.1",
]

[project.optional-dependencies]
notebooks = [
  "ipykernel",
  "jupyterlab",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_internship"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-m 'not e2e'"
markers = [
  "e2e: manually run integration coverage that requires local Neo4j",
  "local_neo4j: requires the repository's local Neo4j service",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
]

[tool.ruff.lint.per-file-ignores]
"src/ai_internship/prompts/*.py" = ["E501"]
"notebooks/*.ipynb" = ["E501", "F704", "F811"]
"scripts/pipeline_functions.py" = ["E501"]

[dependency-groups]
dev = [
    "jupytext>=1.19.5",
]

[tool.jupytext]
# Every notebook gets a paired Markdown sibling in the same directory --
# that's the file GitHub actually diffs and takes review comments on.
# Markdown (not py:percent) so markdown cells render as real prose in the
# diff, not squashed into Python comments. The .ipynb stays the thing you
# open to see the rendered dashboard; the .md stays the thing a reviewer
# comments on.
formats = "ipynb,md"
